<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KATIYA // Linkler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#130a25;
    --bg-2:#0a0712;
    --bg-3:#050309;
    --purple:#a855f7;
    --pink:#f0abfc;
    --green:#53fc18;
    --text:#f5edff;
    --text-dim:#b399d4;
    --black:#050208;
    --panel:rgba(255,255,255,0.04);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    overflow-x:hidden;
    color:var(--text);
    font-family:'VT323', monospace;
    background:
      radial-gradient(circle at 50% 16%, rgba(168,85,247,0.12), transparent 14%),
      radial-gradient(circle at 18% 28%, rgba(240,171,252,0.05), transparent 9%),
      radial-gradient(circle at 82% 70%, rgba(83,252,24,0.04), transparent 8%),
      radial-gradient(circle at 10% 78%, rgba(255,255,255,0.03), transparent 10%),
      radial-gradient(circle at 90% 12%, rgba(168,85,247,0.06), transparent 10%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
    position:relative;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 20% 20%, rgba(168,85,247,0.04), transparent 8%),
      radial-gradient(circle at 80% 30%, rgba(240,171,252,0.03), transparent 6%),
      radial-gradient(circle at 50% 80%, rgba(168,85,247,0.03), transparent 10%),
      radial-gradient(circle at 35% 55%, rgba(83,252,24,0.025), transparent 7%),
      radial-gradient(circle at 65% 45%, rgba(255,255,255,0.02), transparent 7%);
    opacity:.55;
    z-index:0;
    animation:driftGlow 12s ease-in-out infinite alternate;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(120deg, rgba(255,255,255,0.02), transparent 20%, rgba(255,255,255,0.01), transparent 40%, rgba(255,255,255,0.02), transparent 60%, rgba(255,255,255,0.01), transparent 80%, rgba(255,255,255,0.02)),
      linear-gradient(0deg, rgba(255,255,255,0.02), transparent 15%, transparent 85%, rgba(255,255,255,0.02));
    opacity:.35;
    z-index:1;
    animation:scanMove 9s linear infinite;
  }

  @keyframes driftGlow{
    0%{transform:translate3d(0,0,0) scale(1);}
    100%{transform:translate3d(0,-10px,0) scale(1.02);}
  }

  @keyframes scanMove{
    0%{background-position:0 0, 0 0;}
    100%{background-position:0 220px, 0 0;}
  }

  #sky{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
  }

  .star,.drop,.spark,.orb{position:absolute;}
  .star{
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 6px rgba(255,255,255,0.55);
    animation:twinkle 3.5s ease-in-out infinite;
    opacity:.35;
  }
  .drop{
    top:-20px;
    width:2px;
    height:10px;
    background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(216,180,254,0.8), rgba(255,255,255,0));
    animation:rainFall linear infinite;
    opacity:.26;
  }
  .spark{
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--pink);
    box-shadow:0 0 10px rgba(240,171,252,0.9), 0 0 18px rgba(168,85,247,0.35);
    animation:sparkMove 7s linear infinite;
    opacity:.4;
  }
  .orb{
    width:14px;
    height:14px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.25), rgba(168,85,247,0.08), transparent 70%);
    filter:blur(.2px);
    animation:floatOrb 10s ease-in-out infinite;
    opacity:.22;
  }

  @keyframes twinkle{
    0%,100%{transform:scale(1); opacity:.2;}
    50%{transform:scale(1.8); opacity:.7;}
  }
  @keyframes rainFall{
    0%{transform:translateY(-10vh); opacity:0;}
    10%{opacity:.34;}
    100%{transform:translateY(120vh); opacity:0;}
  }
  @keyframes sparkMove{
    0%{transform:translateY(-10vh) translateX(0) scale(.8);}
    50%{transform:translateY(50vh) translateX(20px) scale(1.2);}
    100%{transform:translateY(120vh) translateX(-10px) scale(.8);}
  }
  @keyframes floatOrb{
    0%,100%{transform:translateY(0) translateX(0) scale(1);}
    50%{transform:translateY(-18px) translateX(12px) scale(1.15);}
  }

  main{
    position:relative;
    z-index:3;
    max-width:460px;
    margin:0 auto;
    padding:34px 20px 70px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .hero{
    position:relative;
    width:360px;
    height:440px;
    margin-bottom:8px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
    border-radius:24px;
    box-shadow:0 0 0 1px rgba(216,180,254,0.12), 0 0 8px rgba(168,85,247,0.05);
    background:rgba(255,255,255,0.01);
  }

  .hero::before,
  .hero::after{
    content:"";
    position:absolute;
    left:50%;
    top:42%;
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }

  .hero::before{
    width:160px;
    height:160px;
    background:radial-gradient(circle, rgba(216,180,254,0.08) 0%, rgba(168,85,247,0.04) 36%, transparent 72%);
    animation:haloPulse 6s ease-in-out infinite;
  }

  .hero::after{
    width:210px;
    height:210px;
    background:radial-gradient(circle, rgba(168,85,247,0.02) 0%, rgba(168,85,247,0.01) 42%, transparent 76%);
    animation:haloPulse2 8s ease-in-out infinite alternate;
  }

  @keyframes haloPulse{
    0%,100%{opacity:.45; transform:translate(-50%,-50%) scale(1);}
    50%{opacity:.65; transform:translate(-50%,-50%) scale(1.01);}
  }
  @keyframes haloPulse2{
    0%{opacity:.18; transform:translate(-50%,-50%) scale(.995);}
    100%{opacity:.3; transform:translate(-50%,-50%) scale(1.005);}
  }

  .hero img{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:41% center;
    transform:scale(1.18);
    filter:drop-shadow(0 8px 12px rgba(0,0,0,0.32));
  }

  .live-dot{
    position:absolute;
    z-index:3;
    top:14px;
    right:8px;
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(5,2,8,0.72);
    border:2px solid var(--green);
    padding:4px 8px;
    font-size:14px;
    letter-spacing:1px;
    color:var(--green);
    text-transform:uppercase;
    box-shadow:0 0 8px rgba(83,252,24,0.08);
  }

  .live-dot .dot{
    width:8px;
    height:8px;
    background:var(--green);
    animation:blink 1s steps(1) infinite;
    box-shadow:0 0 4px rgba(83,252,24,0.45);
  }

  @keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:.2;}
  }

  h1.name{
    font-family:'Press Start 2P', monospace;
    font-size:24px;
    line-height:1.5;
    margin:14px 0 8px;
    letter-spacing:1px;
    text-align:center;
    text-shadow:3px 3px 0 var(--black), 0 0 10px rgba(168,85,247,0.25);
    animation:titleGlow 3.5s ease-in-out infinite alternate;
  }

  @keyframes titleGlow{
    0%{text-shadow:3px 3px 0 var(--black), 0 0 8px rgba(168,85,247,0.22);}
    100%{text-shadow:3px 3px 0 var(--black), 0 0 12px rgba(216,180,254,0.4);}
  }

  .cursor{
    display:inline-block;
    color:var(--green);
    animation:blink 1s steps(1) infinite;
  }

  .tag{
    font-size:19px;
    letter-spacing:2px;
    color:var(--text-dim);
    margin:0 0 10px;
    text-transform:uppercase;
    text-align:center;
  }

  .announcement{
    width:100%;
    margin-bottom:18px;
    padding:12px 14px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(5,2,8,0.42);
    box-shadow:0 10px 24px rgba(0,0,0,0.2);
    color:var(--text);
    text-align:center;
    font-size:18px;
    letter-spacing:1px;
    backdrop-filter:blur(10px);
  }

  .announcement strong{
    color:var(--green);
    text-transform:uppercase;
  }

  .divider{
    width:100%;
    height:6px;
    margin:0 0 24px;
    background-image:linear-gradient(90deg, var(--purple) 0 8px, transparent 8px 14px);
    background-size:14px 6px;
    opacity:.55;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
  }

  .btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:'VT323', monospace;
    font-size:22px;
    letter-spacing:1px;
    text-decoration:none;
    color:var(--text);
    background:rgba(28,15,54,0.45);
    border:2px solid rgba(168,85,247,0.35);
    box-shadow:0 0 0 1px var(--black), 0 5px 0 0 var(--black);
    padding:14px 16px;
    text-transform:uppercase;
    transition:transform .08s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    overflow:hidden;
  }

  .btn::before{
    content:"";
    position:absolute;
    inset:-40% -30%;
    background:linear-gradient(120deg, transparent 35%, rgba(255,255,255,0.06) 50%, transparent 65%);
    transform:translateX(-120%);
    transition:transform .6s ease;
  }

  .btn:hover::before{transform:translateX(120%);}
  .btn:hover{
    background:rgba(58,29,99,0.5);
    border-color:rgba(216,180,254,0.65);
    box-shadow:0 0 0 1px var(--black), 0 5px 0 0 var(--black), 0 0 8px 1px rgba(168,85,247,0.18);
  }

  .btn:active{
    transform:translateY(4px);
    box-shadow:0 0 0 1px var(--black);
  }

  .btn-kick{
    border-color:var(--green);
    color:#eaffe0;
  }

  .btn-kick:hover{
    box-shadow:0 0 0 1px var(--black), 0 5px 0 0 var(--black), 0 0 8px 1px rgba(83,252,24,0.16);
  }

  .icon{
    font-size:20px;
    filter:drop-shadow(1px 1px 0 var(--black));
  }

  .footer{
    margin-top:30px;
    font-size:15px;
    letter-spacing:1px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }

  .heart{
    color:var(--pink);
    animation:beat 1.6s ease-in-out infinite;
  }

  @keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.15);}
  }

  @media (max-width:420px){
    h1.name{font-size:19px;}
    .hero{width:300px; height:360px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  a.btn:focus-visible{
    outline:3px solid var(--purple);
    outline-offset:3px;
  }
</style>
</head>
<body>

<div id="sky" aria-hidden="true"></div>

<main>
  <div class="hero">
    <span class="live-dot"><span class="dot"></span>CANLI</span>
    <img src="https://i.ibb.co/LdpTzTrf/Ads-z-tasar-m-1.png" alt="Katiya portresi, taç ve kolye takıyor">
  </div>

  <h1 class="name">KATIYA<span class="cursor">_</span></h1>
  <p class="tag">Kick Yayıncısı</p>

  <div class="announcement">
    <strong>Duyuru:</strong> Bu akşam 21:00'de yayın var.
  </div>

  <div class="divider"></div>

  <nav class="links">
    <a class="btn btn-kick" href="https://kick.com/katiya" target="_blank" rel="noopener">
      <span class="icon">🎮</span> Kick'te İzle
    </a>
    <a class="btn" href="https://instagram.com/katiya" target="_blank" rel="noopener">
      <span class="icon">📸</span> Instagram
    </a>
    <a class="btn" href="https://tiktok.com/@katiya" target="_blank" rel="noopener">
      <span class="icon">🎵</span> TikTok
    </a>
    <a class="btn" href="#" target="_blank" rel="noopener">
      <span class="icon">💬</span> Discord'a Katıl
    </a>
  </nav>

  <p class="footer">yayın zamanı <span class="heart">♥</span> katiya</p>
</main>

<script>
  const sky = document.getElementById('sky');

  function addParticles(count, className, setup) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = className;
      setup(el, i);
      sky.appendChild(el);
    }
  }

  sky.innerHTML = '';
  addParticles(34, 'star', el => {
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = Math.random() * 100 + 'vh';
    el.style.animationDelay = Math.random() * 5 + 's';
    const size = 1 + Math.random() * 2;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
  });

  addParticles(22, 'drop', el => {
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDelay = Math.random() * 6 + 's';
    el.style.animationDuration = (4 + Math.random() * 6) + 's';
    el.style.height = (10 + Math.random() * 18) + 'px';
  });

  addParticles(18, 'spark', el => {
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDelay = Math.random() * 7 + 's';
    el.style.animationDuration = (5 + Math.random() * 6) + 's';
  });

  addParticles(10, 'orb', el => {
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = Math.random() * 100 + 'vh';
    el.style.animationDelay = Math.random() * 8 + 's';
    el.style.animationDuration = (8 + Math.random() * 8) + 's';
    const size = 8 + Math.random() * 18;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
  });
</script>

</body>
</html>
