<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KATIYA // Linkler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#130a25;
    --bg-2:#0a0712;
    --bg-3:#050309;
    --purple:#a855f7;
    --pink:#f0abfc;
    --green:#53fc18;
    --text:#f5edff;
    --text-dim:#b399d4;
    --black:#050208;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    overflow-x:hidden;
    color:var(--text);
    font-family:'VT323', monospace;
    background:
      radial-gradient(circle at 50% 16%, rgba(168,85,247,0.12), transparent 16%),
      radial-gradient(circle at 18% 28%, rgba(240,171,252,0.05), transparent 10%),
      radial-gradient(circle at 82% 70%, rgba(83,252,24,0.03), transparent 8%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
    position:relative;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 20% 20%, rgba(168,85,247,0.06), transparent 6%),
      radial-gradient(circle at 80% 30%, rgba(240,171,252,0.04), transparent 9%),
      radial-gradient(circle at 50% 80%, rgba(168,85,247,0.05), transparent 12%);
    opacity:.65;
    z-index:0;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(120deg, rgba(255,255,255,0.015), transparent 40%, rgba(255,255,255,0.008), transparent 70%),
      radial-gradient(circle at 50% 50%, rgba(168,85,247,0.05), transparent 42%);
    z-index:1;
  }

  #sparkles, #rain{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
  }

  .sparkle{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:rgba(216,180,254,0.95);
    box-shadow:0 0 10px rgba(168,85,247,0.55);
    opacity:.6;
    animation:drift linear infinite;
  }

  .sparkle.big{
    width:6px;
    height:6px;
    background:rgba(240,171,252,0.95);
    box-shadow:0 0 14px rgba(240,171,252,0.6);
  }

  @keyframes drift{
    0%{transform:translateY(-18vh) translateX(0) scale(.85); opacity:0;}
    12%{opacity:.75;}
    100%{transform:translateY(118vh) translateX(30px) scale(1.08); opacity:0;}
  }

  .drop{
    position:absolute;
    top:-25vh;
    width:2px;
    height:34px;
    border-radius:999px;
    background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(216,180,254,0.85), rgba(255,255,255,0));
    filter:blur(.2px);
    opacity:.22;
    animation:rainFall linear infinite;
  }

  @keyframes rainFall{
    0%{transform:translateY(-25vh); opacity:0;}
    8%{opacity:.22;}
    100%{transform:translateY(140vh); opacity:0;}
  }

  main{
    position:relative;
    z-index:3;
    max-width:460px;
    margin:0 auto;
    padding:56px 20px 70px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .hero{
    position:relative;
    width:360px;
    height:440px;
    margin-bottom:8px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
    border-radius:24px;
    box-shadow:0 0 0 1px rgba(216,180,254,0.12), 0 0 18px rgba(168,85,247,0.10);
    background:rgba(255,255,255,0.01);
  }

  .hero::before,
  .hero::after{
    content:"";
    position:absolute;
    left:50%;
    top:42%;
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }

  .hero::before{
    width:180px;
    height:180px;
    background:radial-gradient(circle, rgba(216,180,254,0.10) 0%, rgba(168,85,247,0.05) 34%, transparent 72%);
    animation:haloPulse 5s ease-in-out infinite;
  }

  .hero::after{
    width:240px;
    height:240px;
    background:radial-gradient(circle, rgba(240,171,252,0.04) 0%, rgba(168,85,247,0.02) 42%, transparent 78%);
    animation:haloPulse2 7s ease-in-out infinite alternate;
  }

  @keyframes haloPulse{
    0%,100%{opacity:.45; transform:translate(-50%,-50%) scale(1);}
    50%{opacity:.75; transform:translate(-50%,-50%) scale(1.03);}
  }
  @keyframes haloPulse2{
    0%{opacity:.16; transform:translate(-50%,-50%) scale(.99);}
    100%{opacity:.28; transform:translate(-50%,-50%) scale(1.02);}
  }

  .hero img{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:41% center;
    transform:scale(1.18);
    filter:drop-shadow(0 8px 12px rgba(0,0,0,0.32));
  }

  .live-dot{
    position:absolute;
    z-index:3;
    top:14px;
    right:8px;
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(5,2,8,0.72);
    border:2px solid var(--green);
    padding:4px 8px;
    font-size:14px;
    letter-spacing:1px;
    color:var(--green);
    text-transform:uppercase;
    box-shadow:0 0 10px rgba(83,252,24,0.12);
  }

  .live-dot .dot{
    width:8px;
    height:8px;
    background:var(--green);
    animation:blink 1s steps(1) infinite;
    box-shadow:0 0 6px rgba(83,252,24,0.6);
  }

  @keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:.2;}
  }

  h1.name{
    font-family:'Press Start 2P', monospace;
    font-size:24px;
    line-height:1.5;
    margin:14px 0 8px;
    letter-spacing:1px;
    text-align:center;
    text-shadow:3px 3px 0 var(--black), 0 0 12px rgba(168,85,247,0.28);
    animation:titleGlow 3.5s ease-in-out infinite alternate;
  }

  @keyframes titleGlow{
    0%{text-shadow:3px 3px 0 var(--black), 0 0 8px rgba(168,85,247,0.22);}
    100%{text-shadow:3px 3px 0 var(--black), 0 0 14px rgba(216,180,254,0.45);}
  }

  .cursor{
    display:inline-block;
    color:var(--green);
    animation:blink 1s steps(1) infinite;
  }

  .tag{
    font-size:19px;
    letter-spacing:2px;
    color:var(--text-dim);
    margin:0 0 22px;
    text-transform:uppercase;
    text-align:center;
  }

  .divider{
    width:100%;
    height:6px;
    margin:0 0 24px;
    background-image:linear-gradient(90deg, var(--purple) 0 8px, transparent 8px 14px);
    background-size:14px 6px;
    opacity:.55;
  }

  .announcement{
    width:100%;
    margin:0 0 18px;
    padding:14px 14px 12px;
    border:2px solid rgba(240,171,252,0.35);
    background:rgba(28,15,54,0.55);
    box-shadow:0 0 0 1px var(--black), 0 5px 0 0 var(--black);
    text-align:center;
  }

  .announcement .title{
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    color:var(--pink);
    margin-bottom:10px;
    line-height:1.4;
  }

  .announcement .text{
    font-size:20px;
    color:var(--text);
    line-height:1.25;
    letter-spacing:.5px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
  }

  .btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:'VT323', monospace;
    font-size:22px;
    letter-spacing:1px;
    text-decoration:none;
    color:var(--text);
    background:rgba(28,15,54,0.52);
    border:2px solid rgba(168,85,247,0.35);
    box-shadow:0 0 0 1px var(--black), 0 5px 0 0 var(--black), 0 0 0 rgba(0,0,0,0);
    padding:14px 16px;
    text-transform:uppercase;
    transition:transform .14s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease, filter .2s ease;
    overflow:hidden;
    will-change:transform;
  }

  .btn::before{
    content:"";
    position:absolute;
    inset:-25% -20%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    transform:translateX(-130%);
    transition:transform .7s ease;
  }

  .btn:hover::before{transform:translateX(130%);}
  .btn:hover{
    background:rgba(58,29,99,0.62);
    border-color:rgba(216,180,254,0.7);
    box-shadow:0 0 0 1px var(--black), 0 5px 0 0 var(--black), 0 0 12px rgba(168,85,247,0.18);
    filter:saturate(1.05);
  }

  .btn:active{
    transform:translateY(3px);
    box-shadow:0 0 0 1px var(--black);
  }

  .btn-kick{
    border-color:rgba(83,252,24,0.8);
    color:#eaffe0;
  }

  .btn-kick:hover{
    box-shadow:0 0 0 1px var(--black), 0 5px 0 0 var(--black), 0 0 12px rgba(83,252,24,0.16);
  }

  .icon{
    font-size:20px;
    filter:drop-shadow(1px 1px 0 var(--black));
  }

  .footer{
    margin-top:30px;
    font-size:15px;
    letter-spacing:1px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }

  .heart{
    color:var(--pink);
    animation:beat 1.6s ease-in-out infinite;
  }

  @keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.15);}
  }

  @media (max-width:420px){
    h1.name{font-size:19px;}
    .hero{width:300px; height:360px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  a.btn:focus-visible{
    outline:3px solid var(--purple);
    outline-offset:3px;
  }
</style>
</head>
<body>

<div id="sparkles" aria-hidden="true"></div>
<div id="rain" aria-hidden="true"></div>

<main>
  <div class="hero">
    <span class="live-dot"><span class="dot"></span>CANLI</span>
    <img src="https://i.ibb.co/LdpTzTrf/Ads-z-tasar-m-1.png" alt="Katiya portresi, taç ve kolye takıyor">
  </div>

  <h1 class="name">KATIYA<span class="cursor">_</span></h1>
  <p class="tag">Kick Yayıncısı</p>

  <div class="divider"></div>

  <section class="announcement" aria-label="Duyuru">
    <div class="title">DUYURU</div>
    <div class="text">Buraya duyuru metnini ekleyebiliriz.</div>
  </section>

  <nav class="links">
    <a class="btn btn-kick" href="https://kick.com/katiya" target="_blank" rel="noopener">
      <span class="icon">🎮</span> Kick'te İzle
    </a>
    <a class="btn" href="https://instagram.com/katiya" target="_blank" rel="noopener">
      <span class="icon">📸</span> Instagram
    </a>
    <a class="btn" href="https://tiktok.com/@katiya" target="_blank" rel="noopener">
      <span class="icon">🎵</span> TikTok
    </a>
    <a class="btn" href="#" target="_blank" rel="noopener">
      <span class="icon">💬</span> Discord'a Katıl
    </a>
  </nav>

  <p class="footer">yayın zamanı <span class="heart">♥</span> katiya</p>
</main>

<script>
  const sparkles = document.getElementById('sparkles');
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle' + (Math.random() > 0.72 ? ' big' : '');
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (6 + Math.random() * 5) + 's';
    s.style.animationDelay = (-Math.random() * 8) + 's';
    s.style.opacity = (0.15 + Math.random() * 0.45).toFixed(2);
    sparkles.appendChild(s);
  }

  const rain = document.getElementById('rain');
  const COUNT = 24;
  for (let i = 0; i < COUNT; i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.animationDuration = (3.8 + Math.random() * 3.8) + 's';
    d.style.animationDelay = (-Math.random() * 9) + 's';
    d.style.height = (16 + Math.random() * 20) + 'px';
    d.style.opacity = (0.12 + Math.random() * 0.18).toFixed(2);
    rain.appendChild(d);
  }
</script>

</body>
</html>
